services:
  - type: web
    name: proquote-erp-api
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    healthCheckPath: /health
    disk:
      name: proquote-pdf-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proquote-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://proquote-erp-frontend.onrender.com
      - key: PDF_STORAGE_PATH
        value: /var/data/pdfs
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: proquote-erp-queue
          property: connectionString
      - key: COMPANY_LOGO_URL
        value: /app/REFERENCE/logo.jpeg
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_CONTACTS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM
        sync: false
      - key: COMPANY_BANK_DETAILS
        sync: false

  - type: worker
    name: proquote-erp-worker
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    dockerCommand: celery -A app.tasks.celery_app:celery_app worker --beat --loglevel=INFO
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: SECRET_KEY
      - key: REDIS_URL
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: REDIS_URL
      - key: SMTP_HOST
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: SMTP_HOST
      - key: SMTP_USER
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: SMTP_USER
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: SMTP_PASSWORD
      - key: SMTP_PORT
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: SMTP_PORT
      - key: MAIL_FROM
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: MAIL_FROM
      - key: COMPANY_NAME
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: COMPANY_NAME

  - type: keyvalue
    name: proquote-erp-queue
    plan: 256mb
    ipAllowList: []

  - type: web
    name: proquote-erp-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_RENDER_DEPLOYED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: proquote-erp-db
    databaseName: proquote
    user: proquote
    plan: 0.5c-1g
