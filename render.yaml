services:
  - type: web
    name: proquote-erp-api
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    disk:
      name: proquote-pdf-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proquote-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://proquote-erp-frontend.onrender.com
      - key: PDF_STORAGE_PATH
        value: /var/data/pdfs
      - key: COMPANY_LOGO_URL
        value: /app/REFERENCE/logo.jpeg
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_CONTACTS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM
        sync: false
      - key: COMPANY_BANK_DETAILS
        sync: false

  - type: cron
    name: proquote-erp-expire-quotations
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    schedule: "0 * * * *"
    dockerCommand: python -m app.tasks.run_expiration_job
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proquote-erp-db
          property: connectionString

  - type: cron
    name: proquote-erp-payment-reminders
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    schedule: "0 8 * * *"
    dockerCommand: python -m app.tasks.run_payment_reminders_job
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proquote-erp-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: COMPANY_NAME
        sync: false

  - type: web
    name: proquote-erp-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: proquote-erp-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_RENDER_DEPLOYED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: proquote-erp-db
    databaseName: proquote
    user: proquote
    plan: basic-1gb
